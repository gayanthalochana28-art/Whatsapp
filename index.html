<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110d">
  <meta name="description" content="A consent-first, local WhatsApp broadcast manager for up to 200 contacts. No API key, no credentials, no fake delivery.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WaFlow">
  <title>WaFlow — WhatsApp Broadcast Manager</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="assets/styles.css?v=1.0.2">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/>
      <rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
    </symbol>
    <symbol id="i-users" viewBox="0 0 24 24">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
      <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
    </symbol>
    <symbol id="i-edit" viewBox="0 0 24 24">
      <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
    </symbol>
    <symbol id="i-send" viewBox="0 0 24 24">
      <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
    </symbol>
    <symbol id="i-list" viewBox="0 0 24 24">
      <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.55V21h-4v-.08a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3v-4h.08a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3h4v.08a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21v4h-.08a1.7 1.7 0 0 0-1.52 1Z"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>
    </symbol>
    <symbol id="i-phone" viewBox="0 0 24 24">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.1 9.9a16 16 0 0 0 6 6l1.26-1.26a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/>
    </symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/>
    </symbol>
    <symbol id="i-link" viewBox="0 0 24 24">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24">
      <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>
      <path d="M12 9v4M12 17h.01"/>
    </symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>
    </symbol>
    <symbol id="i-smartphone" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M12 18h.01"/></symbol>
    <symbol id="i-qr" viewBox="0 0 24 24">
      <rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/>
      <path d="M15 15h2v2h-2zM19 15h2M15 19h2M19 19h2v2h-2z"/>
    </symbol>
    <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24">
      <rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
    </symbol>
    <symbol id="i-external" viewBox="0 0 24 24">
      <path d="M15 3h6v6M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
    </symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24">
      <path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>
    </symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8Z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>
    </symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24">
      <path d="m12 3 1.3 3.7L17 8l-3.7 1.3L12 13l-1.3-3.7L7 8l3.7-1.3L12 3ZM19 14l.7 2.3L22 17l-2.3.7L19 20l-.7-2.3L16 17l2.3-.7L19 14ZM5 13l.6 1.9L7.5 15l-1.9.6L5 17.5l-.6-1.9L2.5 15l1.9-.6L5 13Z"/>
    </symbol>
    <symbol id="i-install" viewBox="0 0 24 24">
      <rect x="5" y="2" width="14" height="20" rx="3"/><path d="M12 6v8M9 11l3 3 3-3M9 18h6"/>
    </symbol>
    <symbol id="i-wifi-off" viewBox="0 0 24 24">
      <path d="m2 2 20 20M8.5 8.5A11 11 0 0 1 22 8M2 8a15.9 15.9 0 0 1 4.2-2.9M5 12.5A11 11 0 0 1 15 12M8.5 16a6 6 0 0 1 6.7-1.2M12 20h.01"/>
    </symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-logo" viewBox="0 0 32 32">
      <path d="M16 3.5C9.1 3.5 3.5 8.6 3.5 14.9c0 3.3 1.6 6.3 4.2 8.4L6.4 28.5l5.9-2.6c1.2.3 2.4.4 3.7.4 6.9 0 12.5-5.1 12.5-11.4S22.9 3.5 16 3.5Z" fill="currentColor"/>
      <path d="M10 13h12M10 17.5h8" fill="none" stroke="#07110d" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar">
      <a class="brand" href="#dashboard" data-nav="dashboard" aria-label="WaFlow dashboard">
        <span class="brand-mark"><svg class="icon"><use href="#i-logo"></use></svg></span>
        <span class="brand-copy"><strong>WaFlow</strong><small>Broadcast studio</small></span>
        <span class="brand-badge">LOCAL</span>
      </a>

      <button class="workspace-card" type="button" data-action="open-settings" aria-label="Open workspace settings">
        <span class="workspace-orb"><svg class="icon"><use href="#i-phone"></use></svg></span>
        <span class="workspace-copy"><small>Workspace</small><strong id="workspaceCountry">Sri Lanka</strong></span>
        <span class="workspace-code" id="workspaceCode">+94</span>
      </button>

      <nav class="main-nav" aria-label="Main navigation">
        <span class="nav-eyebrow">Workspace</span>
        <a class="nav-item" href="#dashboard" data-nav="dashboard">
          <svg class="icon"><use href="#i-grid"></use></svg><span>Dashboard</span>
        </a>
        <a class="nav-item" href="#contacts" data-nav="contacts">
          <svg class="icon"><use href="#i-users"></use></svg><span>Contacts</span><span class="nav-count" id="navContactCount">0</span>
        </a>
        <a class="nav-item" href="#compose" data-nav="compose">
          <svg class="icon"><use href="#i-edit"></use></svg><span>Compose</span>
        </a>
        <a class="nav-item" href="#queue" data-nav="queue">
          <svg class="icon"><use href="#i-list"></use></svg><span>Send queue</span><span class="nav-count nav-count-accent" id="navQueueCount" hidden>0</span>
        </a>
        <span class="nav-eyebrow nav-eyebrow-secondary">Manage</span>
        <a class="nav-item" href="#settings" data-nav="settings">
          <svg class="icon"><use href="#i-settings"></use></svg><span>Settings &amp; guide</span>
        </a>
      </nav>

      <div class="sidebar-spacer"></div>

      <div class="privacy-note">
        <svg class="icon"><use href="#i-shield"></use></svg>
        <p><strong>Local-first by design.</strong> Contacts stay in this browser. No password or OTP is ever requested.</p>
      </div>

      <button class="connection-mini" type="button" data-action="open-connect" id="sidebarConnection">
        <span class="status-orbit"><span class="status-dot"></span></span>
        <span class="connection-mini-copy"><small>WhatsApp</small><strong id="sidebarConnectionText">Not confirmed</strong></span>
        <svg class="icon"><use href="#i-chevron-right"></use></svg>
      </button>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

    <div class="main-wrap">
      <header class="topbar">
        <button class="icon-btn mobile-menu" type="button" data-action="toggle-sidebar" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
          <svg class="icon"><use href="#i-menu"></use></svg>
        </button>
        <div class="page-heading">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Your broadcast command centre.</p>
        </div>
        <div class="topbar-actions">
          <button class="connection-pill" type="button" data-action="open-connect" id="topConnectionPill" aria-label="WhatsApp connection status">
            <span class="status-dot"></span><span id="topConnectionText">Not confirmed</span>
          </button>
          <button class="icon-btn install-button" type="button" data-action="install-app" id="installButton" aria-label="Install WaFlow" title="Install WaFlow" hidden>
            <svg class="icon"><use href="#i-install"></use></svg>
          </button>
          <button class="icon-btn help-button" type="button" data-action="open-help" aria-label="Open sending guide" title="Sending guide">
            <svg class="icon"><use href="#i-info"></use></svg>
          </button>
        </div>
      </header>

      <main id="mainContent" tabindex="-1">
        <div class="view-loading" id="viewLoading"></div>
      </main>
    </div>
  </div>

  <nav class="mobile-dock" aria-label="Quick navigation">
    <a href="#dashboard" data-nav="dashboard"><svg class="icon"><use href="#i-grid"></use></svg><span>Home</span></a>
    <a href="#contacts" data-nav="contacts"><svg class="icon"><use href="#i-users"></use></svg><span>Contacts</span></a>
    <a href="#compose" data-nav="compose" class="dock-compose"><span class="dock-compose-mark"><svg class="icon"><use href="#i-edit"></use></svg></span><span>Compose</span></a>
    <a href="#queue" data-nav="queue"><svg class="icon"><use href="#i-list"></use></svg><span>Queue</span></a>
    <a href="#settings" data-nav="settings"><svg class="icon"><use href="#i-settings"></use></svg><span>More</span></a>
  </nav>

  <dialog class="app-dialog" id="appDialog" aria-labelledby="dialogTitle">
    <div class="dialog-shell">
      <div class="dialog-head">
        <div>
          <span class="dialog-kicker" id="dialogKicker">WaFlow</span>
          <h2 id="dialogTitle">Dialog</h2>
        </div>
        <button class="icon-btn" type="button" data-action="close-dialog" aria-label="Close dialog">
          <svg class="icon"><use href="#i-x"></use></svg>
        </button>
      </div>
      <div class="dialog-body" id="dialogBody"></div>
      <div class="dialog-footer" id="dialogFooter"></div>
    </div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

  <noscript>
    <div class="noscript">WaFlow needs JavaScript to manage your contacts locally in this browser.</div>
  </noscript>

  <script src="assets/app.js?v=1.0.2" defer></script>
</body>
</html>
